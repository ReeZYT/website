<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>reez.cc</title>
  <meta name="description" content="reez — Lukas, software engineer from Düsseldorf. Steam, Discord and Spotify in one place.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050506">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://reez.cc/">
  <meta property="og:title" content="reez.cc">
  <meta property="og:description" content="Steam, Discord and Spotify in one place.">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background: interactive grid that reacts to the pointer -->
  <div class="backdrop" aria-hidden="true">
    <video id="bg-video" class="backdrop__video" muted loop playsinline preload="none"></video>
    <canvas id="bg-canvas" class="backdrop__canvas"></canvas>
    <div class="backdrop__trip"></div>
    <div class="backdrop__dim"></div>
    <div class="backdrop__grain"></div>
  </div>

  <!-- Splash: the click that unlocks sound -->
  <div class="enter" id="enter" hidden>
    <div class="crt" aria-hidden="true"></div>
    <button class="enter__btn" id="enter-btn" type="button">
      <span class="enter__prompt" data-text="[ click to enter ]">[ click to enter ]</span>
      <span class="enter__hint">sound on &middot; press any key</span>
    </button>
  </div>

  <main id="main" class="main">
    <section class="profile" aria-labelledby="name">
      <div class="avatar">
        <img id="avatar-img" src="assets/avatar.webp" alt="" width="104" height="104" decoding="async">
        <span class="avatar__fallback" aria-hidden="true">R</span>
      </div>

      <h1 id="name" class="name" tabindex="-1" aria-label="reez.cc"><span class="name__text" aria-hidden="true" data-text="reez.cc"><span class="name__main">reez</span><span class="name__tld">.cc</span></span><span class="name__cursor" aria-hidden="true"></span></h1>

      <p class="bio">
        <span>Lukas</span><span class="bio__sep" aria-hidden="true">·</span><span>he/him</span><span class="bio__sep" aria-hidden="true">·</span><span>23</span><span class="bio__sep" aria-hidden="true">·</span><span>Düsseldorf, DE</span>
        <span class="bio__role">Software Engineer</span>
      </p>

      <ul class="skills" role="list" aria-label="Skills">
        <li>Reverse Engineering</li>
        <li>Data Mining</li>
        <li>Pattern Recognition</li>
      </ul>

      <p class="meta">
        <span class="meta__item">
          <span class="meta__label">Local time</span>
          <time id="clock">--:--</time>
          <span id="tz" class="meta__tz"></span>
        </span>
      </p>
    </section>

    <nav class="links" aria-label="Profile">
      <ul role="list">
        <li>
          <a class="link" href="https://steamcommunity.com/id/1337ReeZ/" target="_blank" rel="noopener noreferrer">
            <svg class="link__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454 1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z"/></svg>
            <span class="link__text">
              <span class="link__title">Steam</span>
              <span class="link__detail" id="steam-detail">1337ReeZ</span>
            </span>
            <svg class="link__trail" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
            <span class="sr-only">(opens in new tab)</span>
          </a>
        </li>
        <li>
          <button class="link" type="button" id="discord-copy" data-copy="aimbot.dll">
            <span class="link__icon-wrap"><svg class="link__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg><span class="presence-badge" id="discord-badge" hidden></span></span>
            <span class="link__text">
              <span class="link__title">Discord <span class="presence-pill" id="discord-presence" hidden></span></span>
              <span class="link__detail">aimbot.dll</span>
            </span>
            <span class="link__status" id="discord-status" aria-live="polite">Copy</span>
          </button>
        </li>
        <li>
          <a class="link" href="https://open.spotify.com/user/31jvz3d2bg2k4hritofuumsepbmy" target="_blank" rel="noopener noreferrer">
            <svg class="link__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
            <span class="link__text">
              <span class="link__title">Spotify</span>
              <span class="link__detail" id="spotify-detail">Playlists &amp; profile</span>
            </span>
            <svg class="link__trail" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
            <span class="sr-only">(opens in new tab)</span>
          </a>
        </li>
      </ul>
    </nav>

    <form class="gate" id="gate" autocomplete="off" novalidate>
      <label class="gate__prompt" for="gate-key">
        <svg class="gate__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span>forum</span><span class="gate__path">@reez:~$</span>
        <span class="sr-only">access key</span>
      </label>
      <input class="gate__input" id="gate-key" name="key" type="password" placeholder="access key" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button class="gate__btn" id="gate-btn" type="submit">Access</button>
      <span class="sr-only" id="gate-status" aria-live="polite"></span>
    </form>

    <footer class="footer">
      <span>© <span id="year">2026</span> reez.cc</span>
    </footer>
  </main>

  <!-- Shown for a moment when you come back to the tab -->
  <div class="signal" id="signal" aria-hidden="true" hidden>
    <span class="signal__text" data-text="SIGNAL LOST">SIGNAL LOST</span>
    <span class="signal__sub">reconnecting…</span>
  </div>

  <!-- Party mode cats live here -->
  <div class="cats" id="cats" aria-hidden="true"></div>
  <p class="sr-only" id="party-status" aria-live="polite"></p>

  <!-- Boot log, bottom left -->
  <pre class="log" id="log" aria-hidden="true"></pre>

  <!-- Functional layer: the only glass surface on the page -->
  <div class="dock" id="dock" hidden>
    <button class="dock__btn" id="mute" type="button" aria-pressed="false" aria-label="Mute">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="stroke" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="stroke" d="m17 9 5 6M22 9l-5 6"/></svg>
    </button>
    <span class="dock__eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="dock__track" id="track-name"></span>
    <button class="dock__btn dock__exit" id="party-exit" type="button" aria-label="Exit party mode" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="stroke" d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <audio id="audio" src="assets/audio.mp3" loop preload="auto"></audio>
  <audio id="party-audio" src="assets/party.mp3" loop preload="none"></audio>

  <noscript><style>.main{opacity:1;transform:none}.enter{display:none}</style></noscript>
  <script src="script.js" defer></script>
</body>
</html>
