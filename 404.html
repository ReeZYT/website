<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — reez.cc</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: clamp(40px, 10vh, 96px) 0; animation: rise 0.5s var(--ease) both; }
    .lost__out { margin-top: 22px; color: var(--muted); }
    .lost__out b { color: var(--dnd); }
    .home {
      display: inline-flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 28px; padding: 0 16px;
      border: 1px solid var(--line-2); background: var(--panel); text-decoration: none; font-weight: 500;
      transition: background-color var(--fast), color var(--fast), border-color var(--fast);
    }
    .home:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <a class="logo" href="/" aria-label="reez.cc"><span class="logo__mark" aria-hidden="true"></span>reez<span class="logo__tld">.cc</span></a>
      <p class="bar__meta">exit code 404</p>
    </header>
    <main class="lost">
      <p class="prompt" aria-hidden="true"><span class="prompt__user">lukas@reez</span>:<span class="prompt__path">~</span>$ <span class="prompt__cmd">cat ./this-page</span></p>
      <h1 class="name"><span class="name__word">404</span><span class="name__cursor" aria-hidden="true"></span></h1>
      <p class="lost__out"><b>cat:</b> no such file or directory. This page doesn't exist.</p>
      <a class="home" href="/">
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        cd ~ (back to reez.cc)
      </a>
    </main>
    <footer class="foot"><p class="foot__copy">&copy; reez.cc</p></footer>
  </div>
</body>
</html>
