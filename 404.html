<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 ▸ signal lost ▸ reez.cc</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050506">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    /* Same tokens as styles.css */
    :root {
      --bg: #050506;
      --label: #f2f2f7;
      --label-2: #a3a3ab;
      --label-3: #7c7c85;
      --accent: #b7a6ff;
      --cyan: #5ee7ff;
      --dnd: #ff453a;
      --fill: rgba(255, 255, 255, 0.055);
      --fill-hover: rgba(255, 255, 255, 0.095);
      --fill-press: rgba(255, 255, 255, 0.13);
      --separator: rgba(255, 255, 255, 0.1);
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
      --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --radius-row: 16px;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      background: var(--bg); color: var(--label);
      font: 400 1.0625rem/1.47 var(--font-text);
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }
    ::selection { background: var(--accent); color: #0b0b0d; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- Backdrop ---------- */
    .backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .backdrop canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .backdrop__dim {
      position: absolute; inset: 0;
      background: radial-gradient(120% 80% at 50% 40%, rgba(5,5,6,0.1) 0%, rgba(5,5,6,0.55) 70%, rgba(5,5,6,0.9) 100%);
    }
    .backdrop__grain {
      position: absolute; inset: -50%; opacity: 0.06;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .crt {
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 1px, transparent 1px 3px),
        radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.75) 100%);
      animation: crt-flicker 3.2s steps(1) infinite;
    }
    .crt::after {
      content: ""; position: absolute; left: 0; right: 0; top: -20%; height: 18%;
      background: linear-gradient(180deg, transparent, rgba(183,166,255,0.05), transparent);
      animation: crt-roll 6.5s linear infinite;
    }
    @keyframes crt-flicker { 0%, 100% { opacity: 1; } 47% { opacity: 0.85; } 48% { opacity: 1; } 83% { opacity: 0.92; } }
    @keyframes crt-roll { to { transform: translateY(700%); } }

    /* ---------- Content ---------- */
    .main {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px; min-height: 100vh; min-height: 100dvh;
      margin: 0 auto;
      padding: max(48px, env(safe-area-inset-top)) 20px max(48px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: clamp(20px, 4dvh, 36px); text-align: center;
      animation: in 0.7s var(--ease) both;
    }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } }

    .code {
      margin: 0; white-space: nowrap;
      font: 700 min(clamp(6rem, 34vw, 10rem), 22dvh)/0.9 var(--font-display);
      letter-spacing: -0.06em;
      text-shadow: -2px 0 rgba(255,45,110,0.45), 2px 0 rgba(0,220,255,0.45), 0 0 40px rgba(183,166,255,0.25);
    }
    .code__text { position: relative; display: inline-block; }
    .code__text > span { display: inline-block; text-align: center; }
    .code__text::before, .code__text::after {
      content: attr(data-text); position: absolute; inset: 0; pointer-events: none; opacity: 0;
    }
    .code__text::before { color: var(--accent); }
    .code__text::after  { color: var(--cyan); }
    .code.is-glitch .code__text::before { opacity: 0.9; animation: slice-a 0.34s steps(2) both; }
    .code.is-glitch .code__text::after  { opacity: 0.9; animation: slice-b 0.34s steps(2) both; }
    .code.is-glitch .code__text { animation: jitter 0.34s steps(3) both; }
    @keyframes slice-a {
      0% { clip-path: inset(10% 0 62% 0); transform: translate(-5px, 0); }
      33% { clip-path: inset(58% 0 12% 0); transform: translate(6px, 0); }
      66% { clip-path: inset(34% 0 44% 0); transform: translate(-4px, 0); }
      100% { clip-path: inset(80% 0 4% 0); transform: none; }
    }
    @keyframes slice-b {
      0% { clip-path: inset(66% 0 8% 0); transform: translate(5px, 0); }
      33% { clip-path: inset(6% 0 70% 0); transform: translate(-6px, 0); }
      66% { clip-path: inset(44% 0 30% 0); transform: translate(4px, 0); }
      100% { clip-path: inset(20% 0 64% 0); transform: none; }
    }
    @keyframes jitter { 33% { transform: translate(1px, -1px); } 66% { transform: translate(-1px, 1px); } }

    .headline {
      margin: -4px 0 0;
      font: 600 0.8125rem/1.3 var(--font-mono);
      letter-spacing: 0.32em; text-transform: uppercase; color: var(--label-2);
      text-shadow: -1px 0 rgba(255,45,110,0.35), 1px 0 rgba(0,220,255,0.35);
    }
    .headline b { color: var(--dnd); font-weight: 600; }

    .term {
      width: 100%; margin: 0; padding: 14px 16px;
      border-radius: var(--radius-row);
      background: var(--fill); box-shadow: inset 0 0 0 1px var(--separator);
      font: 400 0.8125rem/1.65 var(--font-mono); color: var(--label-3);
      text-align: left; white-space: pre-wrap; word-break: break-all;
      min-height: calc(6 * 1.65em + 28px);
    }
    .term .line { display: block; }
    .term .ok { color: var(--label-2); }
    .term .err { color: var(--dnd); }
    .term .hl { color: var(--accent); }
    .term .caret {
      display: inline-block; width: 0.6em; height: 1.1em; margin-left: 2px;
      vertical-align: -0.2em; background: var(--label-3);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .home {
      display: flex; align-items: center; gap: 16px;
      width: 100%; min-height: 60px; padding: 10px 16px 10px 18px;
      border-radius: var(--radius-row);
      background: var(--fill); box-shadow: inset 0 0 0 1px var(--separator);
      color: var(--label); text-decoration: none; text-align: left;
      transition: background-color 0.18s var(--ease), transform 0.18s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .home:hover { background: var(--fill-hover); }
    .home:active { background: var(--fill-press); transform: scale(0.985); }
    .home__icon { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .home__text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .home__title { font-weight: 600; line-height: 1.2; }
    .home__detail { font: 400 0.8125rem/1.3 var(--font-mono); color: var(--label-2); }
    .home__detail .hl { color: var(--accent); }
    .home__key {
      flex: none; font: 500 0.75rem/1 var(--font-mono); color: var(--label-2);
      padding: 7px 10px; border-radius: 999px; background: rgba(255,255,255,0.06);
    }
    .home__key b { color: var(--label); font-weight: 600; }

    .footer { font: 400 0.8125rem/1.4 var(--font-mono); color: var(--label-3); }

    @media (hover: none) { .home__key { display: none; } }
    @media (max-height: 600px) { .term { min-height: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .main, .crt, .crt::after, .term .caret { animation: none; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <canvas id="bg"></canvas>
    <div class="backdrop__dim"></div>
    <div class="backdrop__grain"></div>
    <div class="crt"></div>
  </div>

  <main class="main">
    <h1 class="code" id="code" aria-label="404 – page not found">
      <span class="code__text" data-text="404" aria-hidden="true"><span>4</span><span>0</span><span>4</span></span>
    </h1>
    <p class="headline"><b>signal lost</b> · page not found</p>

    <pre class="term" id="term" aria-hidden="true"></pre>
    <p class="sr-only">The page you requested does not exist.</p>

    <a class="home" href="/" id="home">
      <svg class="home__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span class="home__text">
        <span class="home__title">Back to reez.cc</span>
        <span class="home__detail"><span class="hl">$</span> cd ~</span>
      </span>
      <span class="home__key" aria-hidden="true">press <b>⏎</b></span>
    </a>

    <footer class="footer">© <span id="year">2026</span> reez.cc</footer>
  </main>

  <script>
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.getElementById("year").textContent = new Date().getFullYear();

    /* ---------- Terminal log with the requested path ---------- */
    const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let path = location.pathname + location.search;
    try { path = decodeURIComponent(path); } catch {}
    if (path.length > 60) path = path.slice(0, 57) + "…";
    const addr = "0x" + (0x404000 + Math.floor(Math.random() * 0xfff)).toString(16).padStart(8, "0");
    const LINES = [
      `» GET <span class="hl">${esc(path)}</span>`,
      `» resolving route <span class="err">[fail]</span>`,
      `» scanning memory at ${addr} <span class="err">[null]</span>`,
      `» segfault: page does not exist`,
      `» dumping core… just kidding`,
      `» suggestion: <span class="ok">cd ~</span>`,
    ];
    const term = document.getElementById("term");
    const render = (n, caret) => {
      const rows = LINES.slice(0, n);
      if (caret) rows.push((rows.pop() ?? "") + '<span class="caret"></span>');
      term.innerHTML = rows.map((l) => `<span class="line">${l}</span>`).join("");
    };
    if (reduce) render(LINES.length, false);
    else {
      let i = 0; render(0, true);
      const t = setInterval(() => { render(++i, true); if (i >= LINES.length) clearInterval(t); }, 380);
    }

    /* ---------- 404: decode on load, glitch now and then ---------- */
    const code = document.getElementById("code");
    const digits = [...code.querySelectorAll(".code__text > span")];
    const GLYPHS = "01<>/\\|[]{}#$%&*+=-_";
    digits.forEach((d) => { d.style.width = d.offsetWidth + "px"; });
    function glitch() {
      code.classList.remove("is-glitch"); void code.offsetWidth;
      code.classList.add("is-glitch");
      setTimeout(() => code.classList.remove("is-glitch"), 360);
    }
    let busy = false;
    function decode() {
      if (busy) return; busy = true;
      const target = "404", settle = [8, 12, 16];
      let f = 0;
      (function run() {
        digits.forEach((d, i) => { d.textContent = f >= settle[i] ? target[i] : GLYPHS[(Math.random() * GLYPHS.length) | 0]; });
        if (++f <= settle[2]) setTimeout(run, 40); else { busy = false; glitch(); }
      })();
    }
    if (!reduce) {
      decode();
      code.addEventListener("pointerenter", decode);
      (function loop() { setTimeout(() => { if (!document.hidden) glitch(); loop(); }, 2500 + Math.random() * 3000); })();
    }

    /* ---------- Enter / Escape takes you home ---------- */
    document.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); location.href = "/"; }
    });

    /* ---------- Tab title ---------- */
    const TITLE = "404 ▸ signal lost ▸ reez.cc ▸ ";
    let pos = 0;
    if (!reduce) setInterval(() => {
      if (document.hidden) return;
      pos = (pos + 1) % TITLE.length;
      document.title = TITLE.slice(pos) + TITLE.slice(0, pos);
    }, 320);
    document.addEventListener("visibilitychange", () => { if (document.hidden) document.title = "still lost…"; });

    /* ---------- Background: the same dot grid, but broken ----------
       Dots react to the pointer like on the home page, but some rows
       are "corrupted": they flicker, drift sideways and glow red.    */
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    const GAP = 26, RADIUS = 160, PUSH = 24;
    let w = 0, h = 0, dots = [], raf = null, bands = [];
    const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999, active: false, last: 0 };
    const ripples = [];

    function build() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      dots = [];
      const ox = (w % GAP) / 2, oy = (h % GAP) / 2;
      for (let y = oy; y <= h; y += GAP)
        for (let x = ox; x <= w; x += GAP)
          dots.push({ ox: x, oy: y, x, y, vx: 0, vy: 0, glow: 0, seed: Math.random() });
    }

    function frame(t) {
      if (!pointer.active || t - pointer.last > 4000) {
        pointer.tx = w * (0.5 + 0.35 * Math.sin(t / 5200));
        pointer.ty = h * (0.5 + 0.3 * Math.sin(t / 3700 + 1.3));
      }
      if (pointer.x < -1000) { pointer.x = pointer.tx; pointer.y = pointer.ty; }
      pointer.x += (pointer.tx - pointer.x) * 0.18;
      pointer.y += (pointer.ty - pointer.y) * 0.18;

      // new corrupted band now and then
      if (Math.random() < 0.025) bands.push({ y: Math.random() * h, hgt: GAP * (1 + (Math.random() * 3 | 0)), shift: (Math.random() - 0.5) * 60, born: t, life: 180 + Math.random() * 420 });
      bands = bands.filter((b) => t - b.born < b.life);

      const maxR = Math.max(w, h);
      for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].r += 9; if (ripples[i].r > maxR) ripples.splice(i, 1); }

      ctx.clearRect(0, 0, w, h);
      for (const d of dots) {
        const dx = d.ox - pointer.x, dy = d.oy - pointer.y, dist = Math.hypot(dx, dy);
        let fx = 0, fy = 0, target = 0, bad = false;
        if (dist < RADIUS) {
          const f = 1 - dist / RADIUS, e = f * f;
          fx += (dx / (dist || 1)) * PUSH * e; fy += (dy / (dist || 1)) * PUSH * e; target = e;
        }
        for (const r of ripples) {
          const rd = Math.hypot(d.ox - r.x, d.oy - r.y), band = Math.abs(rd - r.r);
          if (band < 40) {
            const k = (1 - band / 40) * (1 - r.r / maxR);
            fx += ((d.ox - r.x) / (rd || 1)) * 14 * k; fy += ((d.oy - r.y) / (rd || 1)) * 14 * k;
            target = Math.max(target, k);
          }
        }
        for (const b of bands) if (d.oy >= b.y && d.oy < b.y + b.hgt) { fx += b.shift; bad = true; }

        d.vx = (d.vx + (d.ox + fx - d.x) * 0.12) * 0.78;
        d.vy = (d.vy + (d.oy + fy - d.y) * 0.12) * 0.78;
        d.x += d.vx; d.y += d.vy;
        d.glow += (target - d.glow) * 0.15;

        // some dots are simply dead
        if (d.seed < 0.06 && Math.sin(t / 140 + d.seed * 900) > 0.2) continue;
        const tw = 0.12 + 0.06 * Math.sin(t / 900 + d.seed * 40);
        const a = Math.min(1, tw + d.glow * 0.85 + (bad ? 0.35 : 0));
        const size = 1.4 + d.glow * 1.6;
        ctx.fillStyle = bad
          ? `rgba(255, 69, 58, ${a})`
          : d.glow > 0.05
            ? `rgba(${(183 - 90 * d.glow) | 0}, ${(166 + 60 * d.glow) | 0}, 255, ${a})`
            : `rgba(210, 200, 255, ${a})`;
        ctx.fillRect(d.x - size / 2, d.y - size / 2, size, size);
      }
      raf = requestAnimationFrame(frame);
    }

    function drawStatic() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "rgba(210, 200, 255, 0.12)";
      for (const d of dots) ctx.fillRect(d.ox - 0.75, d.oy - 0.75, 1.5, 1.5);
    }
    function start() {
      if (raf) cancelAnimationFrame(raf); raf = null;
      build();
      if (reduce) drawStatic(); else raf = requestAnimationFrame(frame);
    }

    addEventListener("pointermove", (e) => { pointer.tx = e.clientX; pointer.ty = e.clientY; pointer.active = true; pointer.last = performance.now(); }, { passive: true });
    document.documentElement.addEventListener("pointerleave", () => { pointer.active = false; });
    addEventListener("pointerdown", (e) => { if (!reduce) ripples.push({ x: e.clientX, y: e.clientY, r: 0 }); }, { passive: true });
    let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(start, 120); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(raf); raf = null; } else start(); });
    start();
  </script>
</body>
</html>
