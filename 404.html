<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — reez.cc</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    /* Same tokens as styles.css */
    :root {
      --bg: #f2efe8; --ink: #141413; --ink-2: #57554f; --ink-3: #8a877f;
      --line: rgba(20, 20, 19, 0.14); --accent: #ff4f1a;
      --font: "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --gutter: clamp(20px, 5vw, 56px);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f0f0e; --ink: #edeae3; --ink-2: #a8a59d; --ink-3: #6f6c66; --line: rgba(237, 234, 227, 0.13); --accent: #ff6a3d; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: grid; grid-template-rows: auto 1fr auto; gap: 40px;
      max-width: 1180px; margin: 0 auto; padding: var(--gutter);
      background: var(--bg); color: var(--ink);
      font: 400 1rem/1.5 var(--font); -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--accent); color: #fff; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .mark, .foot { font: 500 0.8125rem/1 var(--mono); }
    .mark { font-weight: 700; color: inherit; text-decoration: none; }
    .mark span, .foot { color: var(--ink-3); }
    main { align-self: end; display: grid; justify-items: start; gap: 24px; }
    h1 {
      margin: 0 0 0 -0.04em;
      font: 800 clamp(6rem, 24vw, 16rem)/0.82 var(--font); letter-spacing: -0.065em;
    }
    h1::after {
      content: ""; display: inline-block; width: 0.16em; height: 0.16em;
      margin-left: 0.04em; background: var(--accent);
    }
    p { margin: 0; max-width: 36ch; font-size: 1.0625rem; color: var(--ink-2); }
    .home {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 18px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--ink); text-decoration: none; font-weight: 600;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
    }
    .home:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .home svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .foot { margin: 0; }
  </style>
</head>
<body>
  <a class="mark" href="/">reez<span>.cc</span></a>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist. Maybe it never did.</p>
    <a class="home" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Back to reez.cc
    </a>
  </main>
  <p class="foot">&copy; reez.cc</p>
</body>
</html>
